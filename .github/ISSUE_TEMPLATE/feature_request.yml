name: Feature request
description: Propose a change in behaviour
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't be done today? Please describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: guarantees
    attributes:
      label: Effect on what the project claims
      description: |
        Does this change what a proof establishes, what "verified" means, or how credit is
        graded? If so, say how. Changes that widen a claim need to be worth it.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
